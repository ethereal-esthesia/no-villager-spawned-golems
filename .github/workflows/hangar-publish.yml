name: Publish Current Version to Hangar

on:
  workflow_dispatch:
    inputs:
      confirm_publish:
        description: Type "publish" to publish the current Gradle pluginVersion to Hangar.
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && inputs.confirm_publish == 'publish'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Run Paper integration tests
        run: ./scripts/paper-integration-test.sh

      - name: Publish to Hangar
        env:
          HANGAR_API_TOKEN: ${{ secrets.HANGAR_API_TOKEN }}
        run: ./gradlew publishPluginPublicationToHangar --stacktrace
