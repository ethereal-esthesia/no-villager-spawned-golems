name: Release for Paper Version

on:
  push:
    branches:
      - main
    paths:
      - src/main/**
      - build.gradle.kts
      - gradle.properties
      - settings.gradle.kts
      - gradle/**
      - gradlew
      - gradlew.bat
      - scripts/**
  workflow_dispatch:
    inputs:
      confirm_release:
        description: Type "release" to create a release for the requested Paper version.
        required: true
        type: string
      paper_version:
        description: Paper/Minecraft API version to pin, for example 26.1.2.
        required: true
        type: string
      paper_dependency_version:
        description: Full Paper API dependency version, for example 26.1.2.build.72-stable.
        required: true
        type: string
      plugin_version:
        description: Optional explicit plugin version. Defaults to next patch when the Paper pin changes.
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.confirm_release == 'release')

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Update release metadata
        id: update
        run: |
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "Push build uses existing gradle.properties Paper pin."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          args=(--paper-version "${{ inputs.paper_version }}" --paper-dependency-version "${{ inputs.paper_dependency_version }}")
          if [ -n "${{ inputs.plugin_version }}" ]; then
            args+=(--plugin-version "${{ inputs.plugin_version }}")
          fi
          ./scripts/update-to-paper-version.sh "${args[@]}"

      - name: Read release version
        id: version
        run: |
          version="$(./scripts/project-version.sh)"
          paper_api_version="$(./scripts/paper-api-version.sh)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "paper_api_version=${paper_api_version}" >> "$GITHUB_OUTPUT"

      - name: Resolve release tag
        id: tag
        run: |
          git fetch --tags --force
          base_tag="v${{ steps.version.outputs.version }}"
          head_commit="$(git rev-parse HEAD)"
          short_commit="$(git rev-parse --short=12 HEAD)"
          tag="$base_tag"
          commit_release=false

          if git rev-parse "$base_tag" >/dev/null 2>&1; then
            base_commit="$(git rev-list -n 1 "$base_tag")"
            if [ "$base_commit" != "$head_commit" ]; then
              tag="${base_tag}-g${short_commit}"
              commit_release=true
            fi
          fi

          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "head_commit=${head_commit}" >> "$GITHUB_OUTPUT"
          echo "short_commit=${short_commit}" >> "$GITHUB_OUTPUT"
          echo "commit_release=${commit_release}" >> "$GITHUB_OUTPUT"

      - name: No release needed
        if: steps.update.outputs.changed != 'true' && steps.tag.outputs.exists == 'true'
        run: echo "Release ${{ steps.tag.outputs.tag }} is already current for Paper ${{ steps.version.outputs.paper_api_version }}."

      - name: Refuse duplicate tag for changed metadata
        if: steps.update.outputs.changed == 'true' && steps.tag.outputs.exists == 'true'
        run: |
          echo "Tag ${{ steps.tag.outputs.tag }} already exists." >&2
          exit 1

      - name: Run Paper integration tests
        if: steps.update.outputs.changed == 'true' || steps.tag.outputs.exists != 'true'
        run: ./scripts/paper-integration-test.sh

      - name: Commit release metadata
        if: steps.update.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradle.properties
          git commit -m "Release ${{ steps.version.outputs.version }} for Paper ${{ steps.version.outputs.paper_api_version }}"
          git push origin HEAD:main

      - name: Create GitHub release
        if: steps.tag.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          PAPER_API_VERSION: ${{ steps.version.outputs.paper_api_version }}
        run: |
          gh release create "$TAG" \
            build/libs/NoVillagerSpawnedGolems-"$VERSION"-paper-"$PAPER_API_VERSION".jar \
            --target "$(git rev-parse HEAD)" \
            --title "NoVillagerSpawnedGolems $VERSION for Paper $PAPER_API_VERSION" \
            --notes "Release $VERSION for Paper $PAPER_API_VERSION. Paper integration tests passed before publishing."

      - name: Publish to Hangar
        if: steps.tag.outputs.exists != 'true' && steps.tag.outputs.commit_release != 'true'
        env:
          HANGAR_API_TOKEN: ${{ secrets.HANGAR_API_TOKEN }}
        run: ./gradlew publishPluginPublicationToHangar --stacktrace
